# Builds and publishes main.pdf.
#
# The build itself lives in .github/workflows/latex-build-deploy.yml, which every
# notes repository derived from this template calls instead of carrying its own
# copy. This file is the caller, and it exists only because a reusable workflow
# cannot declare its own `on:` triggers.
#
# A notes repository copies this file with one line changed -- the `uses:` below
# becomes the absolute form, so that it tracks the template:
#
#   uses: thefundamentaltheor3m/Lecture-Notes-Template-2026/.github/workflows/latex-build-deploy.yml@main
#
# Here in the template the local `./` form is deliberate: it runs the reusable
# workflow as it stands in the commit under test, so a pull request that changes
# the build is checked by the build it changes, rather than by whatever is on
# `main`.

name: Build and Deploy LaTeX Project

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'README.md'
      - 'TOPICS.md'
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - '.claude/**'
      - '.vscode/**'
      - '.gitignore'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'README.md'
      - 'TOPICS.md'
  workflow_dispatch:

# A second push to the same branch makes the first build's PDF irrelevant.
# Concurrency belongs to the caller: it is keyed on the triggering ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  latex:
    uses: ./.github/workflows/latex-build-deploy.yml
    # A called workflow cannot grant itself more than the caller has, so the
    # publishing jobs' `contents: write` and `pull-requests: write` are granted
    # here and narrowed there.
    permissions:
      contents: write
      pull-requests: write
